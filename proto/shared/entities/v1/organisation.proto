syntax = "proto3";

package shared.entities.v1;

option go_package = "gymbo.stixman.co/shared/gen/entities/v1";

import "google/protobuf/timestamp.proto";

message Organisation {
  string id = 1;
  string name = 2;
  string email = 3;
  string address = 4;
  string phone = 5;
  string logo = 6;
  string website = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp deleted_at = 10;
}