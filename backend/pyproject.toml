[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Marco Lee",email = "marco.lee@datax.io"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.0.1,<2.0.0)",
    "numpy (<2)",
    "pydantic (>=2.10.6,<3.0.0)",
    "opencv-python (==4.10.0.84)",
    "mediapipe (==0.10.18)",
    "boto3 (>=1.36.16,<2.0.0)",
    "python-socketio>=5.12.1,<6",
    "ultralytics>=8.4.47",
    "uvicorn[standard]>=0.34",
    "pymongo>=4.10,<5",
    "fastapi>=0.115,<1",
    "redis>=5,<6",
    "runpod>=1.7,<2",
]

[project.scripts]
agent = "python agent.py dev"

[dependency-groups]
dev = [
    "ruff>=0.11.13",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ml_stack_import: test module imports Ultralytics/YOLO (heavy); opt-in via RUN_ML_STACK_TESTS=1",
]
