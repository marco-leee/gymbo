services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - gymbo

  minio:
    image: quay.io/minio/minio:latest
    command: minio server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - gymbo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: qwertyui
      MINIO_DEFAULT_BUCKET: gymbo

  mongo-db:
    image: mongo:7.0.34
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: gymbo
      MONGO_INITDB_ROOT_PASSWORD: gymbo
      MONGO_INITDB_DATABASE: gymbo
    networks:
      - gymbo

volumes:
  minio:
    driver: local
  mongo-db:
    driver: local

networks:
  gymbo:
    driver: bridge