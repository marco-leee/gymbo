services:
  caddy:
    image: caddy
    build:
      context: .
      dockerfile: caddy.dockerfile
    ports:
      - "443:443"
    environment:
      # - DOMAIN=localhost
      - DOMAIN=gymbo-gradio.stixman.co
      - BACKEND_HOST=gradio
      - BACKEND_PORT=7860
      - APP_DOMAIN=api.stixman.co
      - APP_HOST=sio-server
      - APP_PORT=10000
    networks:
      - gymbo

  sio-server:
    image: sio-server
    build:
      context: .
      dockerfile: sio-server.dockerfile
    ports:
      - "10000:10000"
    networks:
      - gymbo

  gradio:
    image: gradio
    build:
      context: .
      dockerfile: gradio.dockerfile
    ports:
      - "7860:7860"
    environment:
      - USER=admin
      - PASSWORD=sayplease
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devsecret
      - LIVEKIT_API_SECRET=secret
      - S3_ACCESS_KEY=dummy
      - S3_SECRET=dummy
    networks:
      - gymbo

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - gymbo

  postgres:
    image: postgres:17.5-alpine3.22
    ports:
      - "32800:5432"
    volumes:
      - psql-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=local
      - POSTGRES_DB=gymbo
    restart: 'no'
    networks:
      - gymbo

  minio:
    image: quay.io/minio/minio:latest
    command: minio server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - gymbo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: qwertyui
      MINIO_DEFAULT_BUCKET: gymbo

  services:
    image: services
    build:
      context: .
      dockerfile: services.dockerfile
    networks:
      - gymbo

  mongo-db:
    image: mongo:7.0.34
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: gymbo
      MONGO_INITDB_ROOT_PASSWORD: gymbo
      MONGO_INITDB_DATABASE: gymbo
    networks:
      - gymbo

volumes:
  minio:
    driver: local
  psql-db:
    driver: local
  mongo-db:
    driver: local

networks:
  gymbo:
    driver: bridge
  host:
    driver: host