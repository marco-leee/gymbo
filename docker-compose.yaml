services:
  caddy:
    image: caddy:2.9.1-alpine
    build:
      context: .
      dockerfile: caddy.dockerfile
    ports:
      - "443:443"
    environment:
      - DOMAIN=localhost
      - BACKEND_HOST=gradio
      - BACKEND_PORT=7860
    networks:
      - gymbo

  gradio:
    image: bitnami/python:3.12
    build:
      context: .
      dockerfile: gradio.dockerfile
    ports:
      - "7860:7860"
    networks:
      - gymbo

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - gymbo

  mongo:
    image:  mongodb/mongodb-community-server:8.0.4-ubi9
    ports:
      - "27017:27017"
    networks:
      - gymbo
    volumes:
      - mongo-db:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=local

  minio:
    image: quay.io/minio/minio:latest
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - gymbo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: qwertyui
      MINIO_DEFAULT_BUCKET: gymbo

volumes:
  minio:
    driver: local
  mongo-db:
    driver: local
  data:
    driver: local


networks:
  gymbo:
    driver: bridge